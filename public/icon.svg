<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed, no corner radius: the platform applies the maskable crop. -->
  <rect width="512" height="512" fill="#000000" />
  <!-- Same mark as favicon.svg — one thin white circumference — scaled 32→512
       and inset to the middle 60% so it clears an 80%-diameter maskable safe
       zone with room to spare. -->
  <circle cx="256" cy="256" r="105.6" fill="none" stroke="#ffffff" stroke-width="23.04" />
</svg>
