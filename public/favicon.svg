<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A black disc and one thin white circumference. Round rather than a rounded
    square because the app is a circle and nothing else; the corners are left
    transparent so the browser's own chrome shows through them.

    r=11 puts the stroke's two edges on whole pixels at 16px, where a circle is
    otherwise smeared across three, and 2.4 is the thinnest width that still
    resolves white rather than grey there. Both were picked by rendering at 16px,
    not by arithmetic.
  -->
  <circle cx="16" cy="16" r="15.5" fill="#000" />
  <circle cx="16" cy="16" r="11" fill="none" stroke="#fff" stroke-width="2.4" />
</svg>
